<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dates & Time — English Egyptian Flashcards</title>
  <style>
    :root{color-scheme:light dark;--ink:#1d2531;--paper:#f6f3ee;--card:#fffdfa;--green:#176b5d;--muted:#68747b}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 12% 10%,#f8d99d,transparent 30%),radial-gradient(circle at 86% 88%,#aad9cc,transparent 30%),var(--paper);color:var(--ink);font-family:"Segoe UI",Tahoma,sans-serif}
    main{width:min(100%,700px)} header{display:flex;justify-content:space-between;gap:14px;align-items:start;margin-bottom:18px}h1{font-size:clamp(1.7rem,6vw,2.6rem);letter-spacing:-.05em;margin:0}p{margin:6px 0;color:var(--muted)}.count{padding:8px 12px;border-radius:999px;background:var(--green);color:#fff;font-weight:700;white-space:nowrap}.track{height:8px;border-radius:99px;background:#d8dfdb;overflow:hidden;margin-bottom:18px}.bar{height:100%;width:0;background:var(--green);transition:.2s}
    .stage{height:370px;perspective:1100px}.card{height:100%;position:relative;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}.card.flip{transform:rotateY(180deg)}.face{position:absolute;inset:0;padding:48px 34px;border-radius:28px;background:var(--card);box-shadow:0 18px 42px #26392b26;display:flex;align-items:center;justify-content:center;text-align:center;backface-visibility:hidden}.back{transform:rotateY(180deg);background:#e7f3ee}.label{position:absolute;top:24px;left:28px;text-transform:uppercase;letter-spacing:.09em;font-size:.78rem;font-weight:800;color:var(--muted)}.term{font-weight:800;font-size:clamp(2rem,8vw,4rem);line-height:1.1;letter-spacing:-.05em}.meaning{font-weight:750;font-size:clamp(1.6rem,6vw,2.7rem);line-height:1.45;direction:rtl}.hint{position:absolute;bottom:22px;color:var(--muted);font-size:.9rem}.buttons{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px;margin-top:18px}button{border:0;border-radius:14px;padding:14px 10px;background:#e1e7e4;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}button:active{transform:scale(.97)}#flip{background:var(--green);color:#fff}.footer{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 0;color:var(--muted);font-size:.9rem}.link{padding:0;background:none;color:var(--green);text-decoration:underline}@media(max-width:480px){body{padding:16px}.stage{height:400px}.buttons{grid-template-columns:1fr 1fr}#flip{grid-row:1;grid-column:1/-1}}@media(prefers-color-scheme:dark){:root{--ink:#eff5f1;--paper:#14211d;--card:#1e2b26;--muted:#b8c8c0}body{background:radial-gradient(circle at 12% 10%,#714d27,transparent 30%),radial-gradient(circle at 86% 88%,#155448,transparent 30%),var(--paper)}.back{background:#15372f}.track{background:#3a5048}button{background:#354740}}
  </style>
</head>
<body>
  <main>
    <header><div><h1>Dates & time</h1><p>English × Egyptian Arabic</p></div><div class="count" id="count"></div></header>
    <div class="track"><div class="bar" id="bar"></div></div>
    <section class="stage"><div class="card" id="card" role="button" tabindex="0" aria-label="Flip flashcard"><div class="face"><span class="label">English</span><div class="term" id="term"></div><span class="hint">Tap to flip</span></div><div class="face back"><span class="label">Egyptian Arabic</span><div class="meaning" id="meaning"></div><span class="hint">Tap to flip back</span></div></div></section>
    <div class="buttons"><button id="prev" type="button">← Previous</button><button id="flip" type="button">Flip card</button><button id="next" type="button">Next →</button></div>
    <div class="footer"><span>Use ← → and Space on your keyboard</span><button class="link" id="shuffle" type="button">Shuffle</button></div>
  </main>
  <script>
    const cards=[
      ["What day is it?","النهارده إيه؟"],["What month is it?","إحنا في شهر إيه؟"],["Fifteen is the last number on my ruler.","رقم خمستاشر هو آخر رقم على المسطرة بتاعتي."],["What is the date?","التاريخ كام؟"],["I help my mother on weekends.","أنا بساعد أمي في عطلات نهاية الأسبوع."],["I go to school on weekdays.","أنا بروح المدرسة في أيام الأسبوع."],["She never wears shoes to bed.","هي عمرها ما بتلبس جزمة وهي رايحة السرير."],["It is early in the morning.","لسه بدري في الصبح."],["Today is Monday.","النهارده الاثنين."],["It is early in the week.","لسه بدري في الأسبوع."],["It is eleven o'clock at night.","الساعة حداشر بالليل."],["It is late at night.","الوقت متأخر بالليل."],["I'm late for work.","أنا متأخر على الشغل."],["Get up early.","اصحى بدري."],["On Saturday.","يوم السبت."],["They are talking during the movie.","هما بيتكلموا أثناء الفيلم."],["What do you do during lunch?","إنت بتعمل إيه أثناء الغدا؟"],["I often play outside.","أنا غالبًا بلعب بره."],["Sometimes I read a book.","ساعات بقرا كتاب."],["My mother often picks me up from school.","أمي غالبًا بتيجي تاخدني من المدرسة."],["At four o'clock.","الساعة أربعة."],["It is twelve o'clock during the day.","الساعة اتناشر أثناء النهار."],["It is noon.","الوقت الضهر."],["At noon.","عند الضهر."],["At midnight.","عند نص الليل."],["Noon is in the middle of the day.","الضهر بيكون في منتصف اليوم."],["In the middle of the street.","في منتصف الشارع."],["She cuts the apple in the middle.","هي بتقطع التفاحة من المنتصف."],["In the morning.","في الصبح."],["In the afternoon.","بعد الضهر."],["Tonight.","الليلة."]
    ];
    let i=0;const $=x=>document.getElementById(x);function render(){ $('term').textContent=cards[i][0];$('meaning').textContent=cards[i][1];$('count').textContent=`${i+1} / ${cards.length}`;$('bar').style.width=`${((i+1)/cards.length)*100}%`;$('card').classList.remove('flip') }function move(n){i=(i+n+cards.length)%cards.length;render()}function flip(){$('card').classList.toggle('flip')}$('card').onclick=flip;$('flip').onclick=flip;$('next').onclick=()=>move(1);$('prev').onclick=()=>move(-1);$('shuffle').onclick=()=>{for(let n=cards.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[cards[n],cards[j]]=[cards[j],cards[n]]}i=0;render()};document.onkeydown=e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}};render();
  </script>
</body>
</html>
